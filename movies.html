<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub - Movies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">Movie<span>Hub</span></a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a class="active" href="movies.html">Movies</a></li>
            <li><a href="favorites.html">Favorites</a></li>
            <li><a href="reviews.html">Reviews</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="page-banner">
        <p class="small-title">MOVIE COLLECTION</p>
        <h1>Explore Movies</h1>
        <p>Search, filter and discover movies you may love.</p>
    </section>

    <section class="section">
        <div class="filter-box">
            <div class="search-box">
                <input type="text" id="movieSearch" placeholder="Search movie...">
                <button type="button" class="search-btn">Search</button>
            </div>

            <select id="genreFilter">
                <option>All Genres</option>
                <option>Action</option>
                <option>Adventure</option>
                <option>Animation</option>
                <option>Comedy</option>
                <option>Drama</option>
                <option>Romance</option>
                <option>Sci-Fi</option>
                <option>Thriller</option>
            </select>

            <select id="languageFilter">
                <option>All Languages</option>
                <option>English</option>
                <option>Hindi</option>
            </select>

            <select id="yearFilter">
                <option>All Years</option>
                <option>2024</option>
                <option>2023</option>
                <option>2021</option>
                <option>2020</option>
                <option>2019</option>
                <option>2017</option>
                <option>2016</option>
                <option>2014</option>
                <option>2012</option>
                <option>2010</option>
                <option>2009</option>
                <option>2008</option>
                <option>1999</option>
                <option>1994</option>
                <option>1972</option>
            </select>

            <select id="ratingFilter">
                <option>All Ratings</option>
                <option value="9">9+ Rating</option>
                <option value="8">8+ Rating</option>
                <option value="7">7+ Rating</option>
            </select>

            <select id="sortMovies">
                <option>Sort Movies</option>
                <option>Name A-Z</option>
                <option>Name Z-A</option>
                <option>Rating High-Low</option>
                <option>Rating Low-High</option>
                <option>Newest First</option>
                <option>Oldest First</option>
            </select>
        </div>

        <div class="movie-grid" id="movieList"></div>
    </section>
</main>

<footer>
    <div class="footer-content">
        <div>
            <h2>Movie<span>Hub</span></h2>
            <p>Your simple place to discover great movies.</p>
        </div>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="favorites.html">Favorites</a>
            <a href="reviews.html">Reviews</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>
    <p class="copyright">© 2026 MovieHub. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
